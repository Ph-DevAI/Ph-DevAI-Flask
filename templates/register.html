<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Balises Open Graph (Facebook, Instagram, WhatsApp) -->
  <meta property="og:title" content="Prince Hilquia Kapseu - Createur de l'entreprise KN-PH et des domaines KN et PH, Createur de Ph-DevAI, Innovateur en Robotique & Développement Web, etudiant en physique et entrepreneur">
  <meta property="og:description" content="Découvrez mes projets, mes idées et ma vision : unir technologie et humanité à travers la robotique et le développement web.">
  <meta property="og:image" content=""> <!-- Mets ici l'URL complète d'une image -->
  <meta property="og:url" content="https://ph-devai.onrender.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <title>Inscription - Ph-DevAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <!-- Navbar transparente -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="nav-back">← Retour</a>
            <a href="{{ url_for('home') }}" class="brand">Ph-DevAI</a>
        </div>
    </nav>

    <!-- Page register -->
    <main class="login-page">
        <div class="login-container">
            <h1>Créer un compte</h1>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-message">
                  {% for message in messages %}
                    <p>{{ message }}</p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}" id="registerForm">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre nom" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>

                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmez votre mot de passe" required>

                <button type="submit" class="btn-login">S'inscrire</button>
            </form>

            <p class="register-link">Déjà un compte ? <a href="{{ url_for('login') }}">Connectez-vous</a></p>
        </div>
    </main>

    <!-- Script de validation -->
    <script>
    const form = document.getElementById('registerForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');

    form.addEventListener('submit', function(e) {
        // Regex pour un mot de passe fort : au moins 8 caractères, majuscule, minuscule, chiffre, caractère spécial
        const strongPassword = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

        if (!strongPassword.test(password.value)) {
            e.preventDefault();
            alert('Votre mot de passe doit contenir au moins 8 caractères, une majuscule, une minuscule, un chiffre et un caractère spécial.');
            password.focus();
            return;
        }

        if (password.value !== confirmPassword.value) {
            e.preventDefault();
            alert('Les mots de passe ne correspondent pas.');
            confirmPassword.focus();
            return;
        }
    });
    </script>
</body>
</html>
