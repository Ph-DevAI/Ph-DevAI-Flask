<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Balises Open Graph (Facebook, Instagram, WhatsApp) -->
  <meta property="og:title" content="Prince Hilquia Kapseu - Createur de l'entreprise KN-PH et des domaines KN et PH, Createur de Ph-DevAI, Innovateur en Robotique & Développement Web, etudiant en physique et entrepreneur">
  <meta property="og:description" content="Découvrez mes projets, mes idées et ma vision : unir technologie et humanité à travers la robotique et le développement web.">
  <meta property="og:image" content=""> <!-- Mets ici l'URL complète d'une image -->
  <meta property="og:url" content="https://ph-devai.onrender.com/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <title>Modifier Projet - Ph-DevAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4"><i class="fa-solid fa-pen"></i> Modifier Projet</h2>

    <form action="{{ url_for('admin_update_project', projet_id=projet.id) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Titre</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ projet.title }}" required>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
                <option value="En cours" {% if projet.status == "En cours" %}selected{% endif %}>En cours</option>
                <option value="Terminé" {% if projet.status == "Terminé" %}selected{% endif %}>Terminé</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ projet.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Image principale</label><br>
            {% if projet.image %}
                <img src="{{ url_for('static', filename='uploads/' + projet.image) }}" width="100" class="mb-2">
            {% endif %}
            <input type="file" class="form-control" name="image">
        </div>

        <div class="mb-3">
            <label class="form-label">Images supplémentaires</label><br>
            {% for img in projet.images %}
                <div class="d-flex align-items-center mb-2">
                    <img src="{{ url_for('static', filename='uploads/' + img.filename) }}" width="80" class="me-2">
                    <form action="{{ url_for('delete_project_image', image_id=img.id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i> Supprimer</button>
                    </form>
                </div>
            {% endfor %}
            <input type="file" class="form-control mt-2" name="images" multiple>
        </div>

        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk me-1"></i> Enregistrer</button>
        <a href="{{ url_for('admin') }}" class="btn btn-secondary"><i class="fa-solid fa-arrow-left me-1"></i> Retour</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
